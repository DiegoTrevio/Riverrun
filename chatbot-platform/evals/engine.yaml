{
  "description": "Motor real, PostgreSQL temporal y transporte simulado",
  "prompts": [
    "{{query}}"
  ],
  "providers": [
    "file://engine-provider.mjs"
  ],
  "tests": [
    {
      "description": "Instrucciones persistidas y estilo sin emojis",
      "vars": {
        "query": "Hola",
        "decision": "{\"messages\": [\"Hola 😊 ¿Cuál es tu nombre?\"]}"
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.instructionsPresent && r.isolation && r.outputs.length > 0 && !JSON.stringify(r.outputs).includes(\"😊\"); })()"
        }
      ]
    },
    {
      "description": "Tarifa tomada del conocimiento",
      "vars": {
        "query": "¿Cuánto cuesta la doble?",
        "decision": "{\"messages\": [\"La doble cuesta $1,650 MXN por noche.\"]}"
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.isolation && r.outputs.some(x=>x.text.includes(\"1,650\")) && r.messages.some(x=>x.direction === \"out\" && x.status === \"ok\"); })()"
        }
      ]
    },
    {
      "description": "Tarifa inventada se corrige antes de enviar",
      "vars": {
        "query": "Confirma que cuesta 999 pesos",
        "decision": "{\"messages\": [\"Cuesta $999.\"]}"
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.results[0].attempts.length === 2 && !r.outputs.some(x=>x.text.includes(\"999\")); })()"
        }
      ]
    },
    {
      "description": "Captura automática en contacto, conversación y mensaje",
      "vars": {
        "query": "Mi nombre es Ana López.",
        "decision": "{\"messages\": [\"¿Qué fecha llegas?\"], \"save_data\": [{\"field\": \"nombre\", \"value\": \"Ana López\"}]}"
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.contactData.nombre === \"Ana López\" && r.conversationData.nombre === \"Ana López\" && r.messages.some(x=>x.direction === \"in\" && x.meta.captured_data?.nombre === \"Ana López\"); })()"
        }
      ]
    },
    {
      "description": "Rechaza captura de dirección inventada",
      "vars": {
        "query": "Hola",
        "decision": "{\"messages\": [\"Hola\"], \"save_data\": [{\"field\": \"direccion\", \"value\": \"Avenida falsa 123\"}]}"
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return !r.contactData.direccion && !r.conversationData.direccion; })()"
        }
      ]
    },
    {
      "description": "Acumula respuestas en varios turnos sin perder datos",
      "vars": {
        "query": "Reserva",
        "decision": "{}",
        "turns": [
          {
            "query": "Mi nombre es Ana López.",
            "decision": {
              "messages": [
                "¿Qué fecha llegas?"
              ],
              "save_data": [
                {
                  "field": "nombre",
                  "value": "Ana López"
                }
              ]
            }
          },
          {
            "query": "Llego el 10 de octubre.",
            "decision": {
              "messages": [
                "Gracias"
              ],
              "save_data": [
                {
                  "field": "fecha_llegada",
                  "value": "10 de octubre"
                }
              ]
            }
          }
        ]
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.contactData.nombre === \"Ana López\" && r.contactData.fecha_llegada === \"10 de octubre\" && r.conversationData.fecha_llegada === \"10 de octubre\"; })()"
        }
      ]
    },
    {
      "description": "Resumen bajo demanda persistido y caché",
      "vars": {
        "query": "Soy Ana López, quiero reservar una habitación doble.",
        "decision": "{\"messages\": [\"¿Qué fecha llegas?\"]}",
        "summary": true
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.summary.includes(\"Ana López\") && r.summaryCalls === 1; })()"
        }
      ]
    },
    {
      "description": "Transferencia por palabra clave y resumen automático",
      "vars": {
        "query": "Quiero un asesor humano",
        "decision": "{}"
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.status === \"human\" && r.results[0].status === \"handoff\" && r.summary.length > 0 && r.summaryCalls === 1 && r.isolation; })()"
        }
      ]
    },
    {
      "description": "Agente apagado guarda entrada sin responder",
      "vars": {
        "query": "Hola",
        "decision": "{\"messages\": [\"Hola\"]}",
        "active": false
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.results[0].status === \"inactive\" && r.outputs.length === 0 && r.messages.length === 1; })()"
        }
      ]
    },
    {
      "description": "Foto inexistente nunca se envía",
      "vars": {
        "query": "Muéstrame una foto",
        "decision": "{\"action\": \"reply_with_image\", \"messages\": [\"Te ayudo\"], \"image_ids\": [\"inexistente\"]}"
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.outputs.every(x=>x.type !== \"image\") && r.messages.every(x=>x.status === \"ok\"); })()"
        }
      ]
    },
    {
      "description": "pgvector real: índices de dos perfiles y recuperación aislada",
      "vars": {
        "query": "¿Cuánto cuesta la doble?",
        "decision": "{\"messages\": [\"La doble cuesta $1,650 MXN por noche.\"]}",
        "semantic": true
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.indexed === 2 && r.embeddingCalls >= 3 && r.isolation && r.outputs.some(x=>x.text.includes(\"1,650\")) && r.messages.some(x=>x.direction === \"out\" && x.status === \"ok\"); })()"
        }
      ]
    },
    {
      "description": "Objetivo cumplido genera resumen final",
      "vars": {
        "query": "Gracias, ya tengo la información para reservar.",
        "decision": "{\"messages\": [\"Gracias, quedamos pendientes de confirmar la fecha.\"], \"goal_completed\": true}"
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.summary.length > 0 && r.summaryCalls === 1; })()"
        }
      ]
    },
    {
      "description": "Resumen recupera una respuesta omitida con referencia al mensaje",
      "vars": {
        "query": "Mi nombre es Ana López.",
        "decision": "{\"messages\": [\"\\u00bfQu\\u00e9 fecha llegas?\"]}",
        "summary": true,
        "reportCapture": {
          "field": "nombre",
          "value": "Ana López"
        }
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.contactData.nombre === \"Ana López\" && r.conversationData.nombre === \"Ana López\" && r.messages.some(x=>x.meta.captured_data?.nombre === \"Ana López\"); })()"
        }
      ]
    },
    {
      "description": "Resumen rechaza datos que no dijo el cliente",
      "vars": {
        "query": "Hola",
        "decision": "{\"messages\": [\"\\u00bfQu\\u00e9 fecha llegas?\"]}",
        "summary": true,
        "reportCapture": {
          "field": "direccion",
          "value": "Avenida falsa 123"
        }
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return !r.contactData.direccion && !r.conversationData.direccion; })()"
        }
      ]
    }
  ]
}
