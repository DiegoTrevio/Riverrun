{
  "description": "Motor real, PostgreSQL temporal y transporte simulado",
  "prompts": [
    "{{query}}"
  ],
  "providers": [
    "file://engine-provider.mjs"
  ],
  "tests": [
    {
      "description": "Instrucciones persistidas y estilo sin emojis",
      "vars": {
        "query": "Hola",
        "decision": "{\"messages\": [\"Hola 😊 ¿Cuál es tu nombre?\"]}"
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.instructionsPresent && r.isolation && r.outputs.length > 0 && !JSON.stringify(r.outputs).includes(\"😊\"); })()"
        }
      ]
    },
    {
      "description": "Tarifa tomada del conocimiento",
      "vars": {
        "query": "¿Cuánto cuesta la doble?",
        "decision": "{\"messages\": [\"La doble cuesta $1,650 MXN por noche.\"]}"
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.isolation && r.outputs.some(x=>x.text.includes(\"1,650\")) && r.messages.some(x=>x.direction === \"out\" && x.status === \"ok\"); })()"
        }
      ]
    },
    {
      "description": "Tarifa inventada se corrige antes de enviar",
      "vars": {
        "query": "Confirma que cuesta 999 pesos",
        "decision": "{\"messages\": [\"Cuesta $999.\"]}"
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.results[0].attempts.length === 2 && !r.outputs.some(x=>x.text.includes(\"999\")); })()"
        }
      ]
    },
    {
      "description": "Captura automática en contacto, conversación y mensaje",
      "vars": {
        "query": "Mi nombre es Ana López.",
        "decision": "{\"messages\": [\"¿Qué fecha llegas?\"], \"save_data\": [{\"field\": \"nombre\", \"value\": \"Ana López\"}]}"
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.contactData.nombre === \"Ana López\" && r.conversationData.nombre === \"Ana López\" && r.messages.some(x=>x.direction === \"in\" && x.meta.captured_data?.nombre === \"Ana López\"); })()"
        }
      ]
    },
    {
      "description": "Rechaza captura de dirección inventada",
      "vars": {
        "query": "Hola",
        "decision": "{\"messages\": [\"Hola\"], \"save_data\": [{\"field\": \"direccion\", \"value\": \"Avenida falsa 123\"}]}"
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return !r.contactData.direccion && !r.conversationData.direccion; })()"
        }
      ]
    },
    {
      "description": "Acumula respuestas en varios turnos sin perder datos",
      "vars": {
        "query": "Reserva",
        "decision": "{}",
        "turns": [
          {
            "query": "Mi nombre es Ana López.",
            "decision": {
              "messages": [
                "¿Qué fecha llegas?"
              ],
              "save_data": [
                {
                  "field": "nombre",
                  "value": "Ana López"
                }
              ]
            }
          },
          {
            "query": "Llego el 10 de octubre.",
            "decision": {
              "messages": [
                "Gracias"
              ],
              "save_data": [
                {
                  "field": "fecha_llegada",
                  "value": "10 de octubre"
                }
              ]
            }
          }
        ]
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.contactData.nombre === \"Ana López\" && r.contactData.fecha_llegada === \"10 de octubre\" && r.conversationData.fecha_llegada === \"10 de octubre\"; })()"
        }
      ]
    },
    {
      "description": "Resumen bajo demanda persistido y caché",
      "vars": {
        "query": "Soy Ana López, quiero reservar una habitación doble.",
        "decision": "{\"messages\": [\"¿Qué fecha llegas?\"]}",
        "summary": true
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.summary.includes(\"Ana López\") && r.summaryCalls === 1; })()"
        }
      ]
    },
    {
      "description": "Transferencia por palabra clave y resumen automático",
      "vars": {
        "query": "Quiero un asesor humano",
        "decision": "{}"
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.status === \"human\" && r.results[0].status === \"handoff\" && r.summary.length > 0 && r.summaryCalls === 1 && r.isolation; })()"
        }
      ]
    },
    {
      "description": "Agente apagado guarda entrada sin responder",
      "vars": {
        "query": "Hola",
        "decision": "{\"messages\": [\"Hola\"]}",
        "active": false
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.results[0].status === \"inactive\" && r.outputs.length === 0 && r.messages.length === 1; })()"
        }
      ]
    },
    {
      "description": "Foto inexistente nunca se envía",
      "vars": {
        "query": "Muéstrame una foto",
        "decision": "{\"action\": \"reply_with_image\", \"messages\": [\"Te ayudo\"], \"image_ids\": [\"inexistente\"]}"
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.outputs.every(x=>x.type !== \"image\") && r.messages.every(x=>x.status === \"ok\"); })()"
        }
      ]
    },
    {
      "description": "pgvector real: índices de dos perfiles y recuperación aislada",
      "vars": {
        "query": "¿Cuánto cuesta la doble?",
        "decision": "{\"messages\": [\"La doble cuesta $1,650 MXN por noche.\"]}",
        "semantic": true
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.indexed === 2 && r.embeddingCalls >= 3 && r.isolation && r.outputs.some(x=>x.text.includes(\"1,650\")) && r.messages.some(x=>x.direction === \"out\" && x.status === \"ok\"); })()"
        }
      ]
    },
    {
      "description": "Objetivo cumplido genera resumen final",
      "vars": {
        "query": "Gracias, ya tengo la información para reservar.",
        "decision": "{\"messages\": [\"Gracias, quedamos pendientes de confirmar la fecha.\"], \"goal_completed\": true}"
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.summary.length > 0 && r.summaryCalls === 1; })()"
        }
      ]
    },
    {
      "description": "Resumen recupera una respuesta omitida con referencia al mensaje",
      "vars": {
        "query": "Mi nombre es Ana López.",
        "decision": "{\"messages\": [\"\\u00bfQu\\u00e9 fecha llegas?\"]}",
        "summary": true,
        "reportCapture": {
          "field": "nombre",
          "value": "Ana López"
        }
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.contactData.nombre === \"Ana López\" && r.conversationData.nombre === \"Ana López\" && r.messages.some(x=>x.meta.captured_data?.nombre === \"Ana López\"); })()"
        }
      ]
    },
    {
      "description": "Resumen rechaza datos que no dijo el cliente",
      "vars": {
        "query": "Hola",
        "decision": "{\"messages\": [\"\\u00bfQu\\u00e9 fecha llegas?\"]}",
        "summary": true,
        "reportCapture": {
          "field": "direccion",
          "value": "Avenida falsa 123"
        }
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return !r.contactData.direccion && !r.conversationData.direccion; })()"
        }
      ]
    },
    {
      "description": "Imagen contextual ante una paráfrasis sin términos exactos",
      "vars": {
        "query": "¿Me enseñas cómo es cada una para decidir dónde quedarnos?",
        "contextPhoto": true,
        "decision": "{\"messages\": [\"Te comparto las opciones.\"], \"context_image_ids\": [\"comparacion\"]}"
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.isolation && r.outputs.filter(x=>x.type === \"image\" && x.image.code === \"comparacion\").length === 1; })()"
        }
      ]
    },
    {
      "description": "No envía imagen contextual ante saludo sin intención relacionada",
      "vars": {
        "query": "Hola, buenos días",
        "contextPhoto": true,
        "decision": "{\"messages\": [\"Hola.\"]}"
      },
      "assert": [
        {
          "type": "javascript",
          "value": "JSON.parse(output).outputs.every(x=>x.type !== \"image\")"
        }
      ]
    },
    {
      "description": "Caminos por respuesta: «Informes» salta al folleto y no pregunta la fecha",
      "vars": {
        "query": "Hola",
        "branching": true,
        "turns": [
          {
            "query": "Hola",
            "decision": {
              "messages": [
                "¡Hola! ¿Vienes a reservar, quieres informes o prefieres hablar con alguien?"
              ]
            }
          },
          {
            "query": "Solo quiero informes",
            "decision": {
              "messages": [
                "Claro. ¿Qué día llegas?"
              ],
              "save_data": [
                {
                  "field": "motivo",
                  "value": "Informes"
                }
              ]
            }
          }
        ]
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); const t=r.perTurn[1].texts.join(' '); return r.contactData.motivo === 'Informes' && t.includes('folleto') && !r.perTurn.slice(1).some(x=>x.texts.join(' ').includes('¿Qué día llegas?')) && r.status === 'bot'; })()"
        }
      ]
    },
    {
      "description": "Caminos por respuesta: «Reservar» sigue en orden con la fecha",
      "vars": {
        "query": "Hola",
        "branching": true,
        "turns": [
          {
            "query": "Hola",
            "decision": {
              "messages": [
                "¡Hola! ¿Vienes a reservar, quieres informes o prefieres hablar con alguien?"
              ]
            }
          },
          {
            "query": "Quiero reservar una habitación",
            "decision": {
              "messages": [
                "Perfecto. ¿Qué día llegas?"
              ],
              "save_data": [
                {
                  "field": "motivo",
                  "value": "Reservar"
                }
              ]
            }
          }
        ]
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); const t=r.perTurn[1].texts.join(' '); return r.contactData.motivo === 'Reservar' && t.includes('¿Qué día llegas?') && !t.includes('folleto'); })()"
        }
      ]
    },
    {
      "description": "Caminos por respuesta: «Hablar con alguien» pasa con una persona",
      "vars": {
        "query": "Hola",
        "branching": true,
        "turns": [
          {
            "query": "Hola",
            "decision": {
              "messages": [
                "¡Hola! ¿Vienes a reservar, quieres informes o prefieres hablar con alguien?"
              ]
            }
          },
          {
            "query": "Prefiero hablar con alguien",
            "decision": {
              "messages": [
                "Va. ¿Qué día llegas?"
              ],
              "save_data": [
                {
                  "field": "motivo",
                  "value": "Hablar con alguien"
                }
              ]
            }
          }
        ]
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.status === 'human' && r.results[1].status === 'handoff' && /Hablar con alguien/.test(r.handoffReason) && !r.perTurn[1].texts.join(' ').includes('¿Qué día llegas?'); })()"
        }
      ]
    },
    {
      "description": "Fotos por regla: bienvenida una vez, palabra del cliente, y al reiniciar vuelve la bienvenida sin historial anterior",
      "vars": {
        "query": "Hola",
        "photos": [
          {
            "code": "bienvenida",
            "name": "Bienvenida",
            "send_when": {
              "mode": "rules",
              "first_message": true
            }
          },
          {
            "code": "menu",
            "name": "Menú",
            "send_when": {
              "mode": "rules",
              "keywords": [
                "menú"
              ]
            }
          }
        ],
        "turns": [
          {
            "query": "Hola, buenas tardes",
            "decision": {
              "messages": [
                "¡Hola! ¿En qué te ayudo?"
              ]
            }
          },
          {
            "query": "¿Me pasas el menú?",
            "decision": {
              "messages": [
                "Claro."
              ]
            }
          },
          {
            "query": "Gracias, muy amable",
            "decision": {
              "messages": [
                "Con gusto."
              ]
            }
          },
          {
            "query": "Hola de nuevo",
            "restart": true,
            "decision": {
              "messages": [
                "¡Hola! ¿En qué te ayudo?"
              ]
            }
          }
        ]
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); const p=r.perTurn.map(x=>x.photos.join(',')); return p[0] === 'bienvenida' && p[1] === 'menu' && p[2] === '' && p[3] === 'bienvenida' && !r.perTurn[3].context.includes('Me pasas el men'); })()"
        }
      ]
    },
    {
      "description": "Objetivo: no se marca mientras falten datos obligatorios; al tenerlos se cumple y pasa a una persona",
      "vars": {
        "query": "Hola",
        "bot": {
          "flow": {
            "goal": "Tomar la solicitud de reserva con nombre y fecha de llegada",
            "on_goal_action": "handoff"
          },
          "data_fields": [
            {
              "key": "nombre",
              "label": "Nombre",
              "type": "name",
              "required": true,
              "question": "¿Cuál es tu nombre?",
              "description": "",
              "options": [],
              "ask_when": "",
              "branches": []
            },
            {
              "key": "fecha_llegada",
              "label": "Fecha de llegada",
              "type": "text",
              "required": true,
              "question": "¿Qué día llegas?",
              "description": "",
              "options": [],
              "ask_when": "",
              "branches": []
            }
          ]
        },
        "turns": [
          {
            "query": "Hola, quiero reservar",
            "decision": {
              "messages": [
                "¡Hola! ¿Cuál es tu nombre?"
              ],
              "goal_completed": true
            }
          },
          {
            "query": "Soy Ana López",
            "decision": {
              "messages": [
                "Gracias, Ana. ¿Qué día llegas?"
              ],
              "save_data": [
                {
                  "field": "nombre",
                  "value": "Ana López"
                }
              ],
              "goal_completed": true
            }
          },
          {
            "query": "Llego el 20 de noviembre",
            "decision": {
              "messages": [
                "Perfecto, Ana. Quedó registrada tu solicitud; en breve alguien del equipo te confirma."
              ],
              "save_data": [
                {
                  "field": "fecha_llegada",
                  "value": "20 de noviembre"
                }
              ],
              "goal_completed": true
            }
          }
        ]
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); const g=r.perTurn.map(x=>x.goalCompleted); return g[0] === false && g[1] === false && g[2] === true && r.status === 'human' && !!r.contactData.nombre && !!r.contactData.fecha_llegada; })()"
        }
      ]
    },
    {
      "description": "Objetivo con camino por respuesta: «Informes» se cumple sin pedir la fecha que el camino saltó",
      "vars": {
        "query": "Hola",
        "branching": true,
        "bot": {
          "flow": {
            "goal": "Atender la solicitud: reserva o informes"
          }
        },
        "turns": [
          {
            "query": "Hola",
            "decision": {
              "messages": [
                "¡Hola! ¿Vienes a reservar, quieres informes o prefieres hablar con alguien?"
              ]
            }
          },
          {
            "query": "Solo quiero informes",
            "decision": {
              "messages": [
                "Claro."
              ],
              "save_data": [
                {
                  "field": "motivo",
                  "value": "Informes"
                }
              ]
            }
          },
          {
            "query": "Sí, mándamelo",
            "decision": {
              "messages": [
                "Listo, gracias por escribirnos."
              ],
              "save_data": [
                {
                  "field": "folleto",
                  "value": "Sí"
                }
              ],
              "goal_completed": true
            }
          }
        ]
      },
      "assert": [
        {
          "type": "javascript",
          "value": "(() => { const r=JSON.parse(output); return r.goalCompleted && r.contactData.folleto === 'Sí' && !r.contactData.fecha_llegada; })()"
        }
      ]
    },
    {
      "description": "Instrucciones largas: llegan completas a la IA, con prioridad sobre las guías de estilo",
      "vars": {
        "query": "Hola",
        "bot": {
          "personality": {
