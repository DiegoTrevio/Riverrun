# Todo en un solo VPS: PostgreSQL + Redis + Evolution API + backend del chatbot (+ Caddy opcional para HTTPS).
# Uso:  cp .env.example .env  (edita los valores)  &&  docker compose up -d
# Con HTTPS:  docker compose --profile https up -d

# Evolution API fijada a una versión verificada (etiqueta legible + digest inmutable): una descarga futura nunca
# cambia la versión por sorpresa. Para cambiarla usa EVOLUTION_IMAGE en .env y aplícala con ./riverrun update
# (respaldo verificado, confirmación y verificación de sesiones). Ver docs/evolution-api.md.
x-evolution-image: &evolution-image ${EVOLUTION_IMAGE:-evoapicloud/evolution-api:v2.3.7@sha256:1bd8afc4a6cf48822e6cf02469aeae7bd35a12a6b616eacd1291926307f4d339}

# INF-9: cada servicio con tope de memoria y de procesos (un servicio desbocado no tumba a los demás ni al servidor) y
# registros que rotan (json-file, 3 × 10 MB). Los topes se ajustan en .env (*_MEM_LIMIT) según el tamaño del servidor.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    pids_limit: 400
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # Arranca como root y se baja a «postgres» (gosu): SETUID/SETGID; CHOWN/DAC_OVERRIDE/FOWNER para preparar el directorio de datos.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    image: pgvector/pgvector:0.8.7-pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chatbot
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-evolution.sql:ro
    healthcheck:
      # Por TCP: en el primer arranque el servidor temporal de los scripts de inicio solo escucha en el socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U chatbot"]
      interval: 10s
      retries: 5
    # Solo en la red interna (sin salida a internet): la alcanzan el backend, Evolution y el respaldo, no Caddy.
    networks: [data]

  redis:
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    pids_limit: 200
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # Corre como root: el command (sh -c) esquiva el entrypoint oficial, que no cambia de usuario. ./riverrun restore deja
    # /data a nombre de «redis» (redis-load.sh hace chown), así que root necesita DAC_OVERRIDE/FOWNER para seguir escribiendo
    # ahí. Solo lectura: escribe en /data (redisdata) y /tmp.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    read_only: true
    tmpfs: [/tmp]
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    restart: unless-stopped
    # Con contraseña (REDIS_PASSWORD, la genera ./riverrun): guarda las claves de las sesiones de WhatsApp.
    command: ["sh", "-c", "exec redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redisdata:/data
    networks: [data]

  evolution:
    mem_limit: ${EVOLUTION_MEM_LIMIT:-1g}
    pids_limit: 400
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    image: *evolution-image
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      # Su propio usuario, solo con su base (./riverrun db-roles); sin él, el superusuario como antes.
      DATABASE_CONNECTION_URI: postgresql://${DB_EVOLUTION_USER:-chatbot}:${DB_EVOLUTION_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"   # necesario para descargar notas de voz
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: ${EVOLUTION_CLIENT_NAME:-Chatbot}
      QRCODE_LIMIT: "30"
      DEL_INSTANCE: "false"
    volumes:
      - evolution_instances:/evolution/instances
    # Solo accesible desde el propio VPS (usa un túnel SSH para abrir el manager).
    ports:
      - "127.0.0.1:8080:8080"
    networks: [default, data]

  backend:
    mem_limit: ${BACKEND_MEM_LIMIT:-1536m}
    pids_limit: 600
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # Corre como «node». Solo escribe en /data/uploads (volumen) y en /tmp (PDF con LibreOffice, si QUOTE_PDF_BACKEND=soffice).
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    # Al actualizar o reiniciar, deja terminar las respuestas en curso (una puede tardar minutos) antes de cortar.
    stop_grace_period: 300s
    # Un init como PID 1: reenvía las señales a node y permite que el vigilante termine un proceso bloqueado.
    init: true
    depends_on:
      postgres: { condition: service_healthy }
      evolution: { condition: service_started }
    environment:
      PORT: 3000
      APP_VERSION: ${APP_VERSION:-dev}
      # Su propio usuario, dueño solo de su base (./riverrun db-roles); sin él, el superusuario como antes.
      DATABASE_URL: postgres://${DB_APP_USER:-chatbot}:${DB_APP_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/chatbot
      WEBHOOK_BASE_URL: http://backend:3000
      # URL pública con HTTPS (Telegram, Messenger, Instagram, chat web e imágenes)
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://${DOMAIN}}
      EVOLUTION_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_IMAGE: *evolution-image
      # strict (por defecto): un problema crítico de configuración impide arrancar. warn: arranca igual (solo emergencias).
      CONFIG_VALIDATION: ${CONFIG_VALIDATION:-strict}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-${OPENAI_API_KEY:-}}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-${OPENAI_MODEL:-openai/gpt-4.1-mini}}
      # Modelo de respaldo si el principal falla (OpenRouter lo usa solo entonces). "none" lo desactiva.
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-google/gemini-2.5-flash}
      OPENROUTER_SUMMARY_MODEL: ${OPENROUTER_SUMMARY_MODEL:-${OPENAI_SUMMARY_MODEL:-openai/gpt-4.1-mini}}
      OPENROUTER_TRANSCRIPTION_MODEL: ${OPENROUTER_TRANSCRIPTION_MODEL:-${OPENAI_TRANSCRIPTION_MODEL:-google/gemini-2.5-flash}}
      KNOWLEDGE_MONITOR_ENABLED: ${KNOWLEDGE_MONITOR_ENABLED:-true}
      KNOWLEDGE_ALERT_PENDING_MINUTES: ${KNOWLEDGE_ALERT_PENDING_MINUTES:-15}
      KNOWLEDGE_ALERT_FALLBACK_RATIO: ${KNOWLEDGE_ALERT_FALLBACK_RATIO:-0.05}
      KNOWLEDGE_ALERT_MIN_ATTEMPTS: ${KNOWLEDGE_ALERT_MIN_ATTEMPTS:-20}
      KNOWLEDGE_ALERT_P95_MS: ${KNOWLEDGE_ALERT_P95_MS:-10000}
      KNOWLEDGE_ALERT_HOURLY_USD: ${KNOWLEDGE_ALERT_HOURLY_USD:-5}
      KNOWLEDGE_SEARCH_ACCOUNT_IDS: ${KNOWLEDGE_SEARCH_ACCOUNT_IDS:-}
      PROCESS_ROLE: ${PROCESS_ROLE:-all}
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-2}
      QUEUE_MAX_ATTEMPTS: ${QUEUE_MAX_ATTEMPTS:-3}
      QUEUE_RETRY_MS: ${QUEUE_RETRY_MS:-60000}
      QUEUE_MAX_RETRY_MS: ${QUEUE_MAX_RETRY_MS:-900000}
      QUEUE_POLL_MS: ${QUEUE_POLL_MS:-500}
      KNOWLEDGE_SEARCH_FORCE_OFF: ${KNOWLEDGE_SEARCH_FORCE_OFF:-false}
      KNOWLEDGE_MIN_SIMILARITY: ${KNOWLEDGE_MIN_SIMILARITY:-0.25}
      EMBEDDING_PRICE_PER_MILLION: ${EMBEDDING_PRICE_PER_MILLION:-}
      KNOWLEDGE_SEARCH_ENABLED: ${KNOWLEDGE_SEARCH_ENABLED:-false}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-openai/text-embedding-3-small}
      OPENROUTER_TIMEOUT_MS: ${OPENROUTER_TIMEOUT_MS:-${OPENAI_TIMEOUT_MS:-45000}}
      ADMIN_USER: ${ADMIN_USER:-admin}
      # Puede quedar vacía una vez creado el superadministrador (config-check lo avisa); SESSION_SECRET no.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:?Define SESSION_SECRET en .env (ejecuta ./riverrun install)}
      # INF-6: llave de los datos cifrados en la base (aparte de SESSION_SECRET); DATA_KEYS_OLD solo durante una rotación.
      DATA_KEY: ${DATA_KEY:-}
      DATA_KEYS_OLD: ${DATA_KEYS_OLD:-}
      # Etapa 7: días que se guarda la bitácora de seguridad (accesos, descargas, borrados), aunque la cuenta ya no exista.
      SECURITY_LOG_DAYS: ${SECURITY_LOG_DAYS:-}
      SECURITY_STUFFING_FAILURES: ${SECURITY_STUFFING_FAILURES:-}
      SECURITY_STUFFING_EMAILS: ${SECURITY_STUFFING_EMAILS:-}
      SECURITY_GLOBAL_FAILURES: ${SECURITY_GLOBAL_FAILURES:-}
      SECURITY_BRUTEFORCE_FAILURES: ${SECURITY_BRUTEFORCE_FAILURES:-}
      SECURITY_EXPORTS_PER_HOUR: ${SECURITY_EXPORTS_PER_HOUR:-}
      SECURITY_ERASURES_PER_HOUR: ${SECURITY_ERASURES_PER_HOUR:-}
      SECURITY_ALERTS_PER_HOUR: ${SECURITY_ALERTS_PER_HOUR:-}
      SECURITY_AUTOBLOCK_MINUTES: ${SECURITY_AUTOBLOCK_MINUTES:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      # Contraseñas filtradas (Have I Been Pwned por rango); off = solo la lista local. PASSWORD_HASH_COST es solo para pruebas.
      PWNED_PASSWORDS_URL: ${PWNED_PASSWORDS_URL:-}
      PASSWORD_HASH_COST: ${PASSWORD_HASH_COST:-}
      UPLOADS_DIR: /data/uploads
      # Autoregistro de empresas y correo saliente
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
      TRIAL_DAYS: ${TRIAL_DAYS:-14}
      SIGNUP_DAILY_MAX: ${SIGNUP_DAILY_MAX:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      DOMAIN: ${DOMAIN:-}
      # Límites de la prueba gratuita (0 = sin límite); los planes de pago llevan los suyos
      TRIAL_MAX_MESSAGES: ${TRIAL_MAX_MESSAGES:-300}
      TRIAL_MAX_CHANNELS: ${TRIAL_MAX_CHANNELS:-2}
      TRIAL_MAX_USERS: ${TRIAL_MAX_USERS:-3}
      TRIAL_MAX_CHATBOTS: ${TRIAL_MAX_CHATBOTS:-2}
      # Google Calendar (opcional)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
      EMAIL_POLL_SECONDS: ${EMAIL_POLL_SECONDS:-60}
      SIGNUP_REQUIRE_EMAIL: ${SIGNUP_REQUIRE_EMAIL:-true}
      MFA_REQUIRED: ${MFA_REQUIRED:-false}
      SMTP_URL: ${SMTP_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      TERMS_URL: ${TERMS_URL:-}
      PRIVACY_URL: ${PRIVACY_URL:-}
      SUPPORT_CONTACT: ${SUPPORT_CONTACT:-}
      AI_ALERT_USD_PER_ACCOUNT: ${AI_ALERT_USD_PER_ACCOUNT:-0}
      AI_TURNS_PER_CONTACT_HOUR: ${AI_TURNS_PER_CONTACT_HOUR:-30}
      AI_MEDIA_PER_CONTACT_HOUR: ${AI_MEDIA_PER_CONTACT_HOUR:-10}
      # Cobro automático (cada proveedor se activa con sus claves)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      BILLING_GRACE_DAYS: ${BILLING_GRACE_DAYS:-5}
      BILLING_CANCEL_AFTER_PAUSE_DAYS: ${BILLING_CANCEL_AFTER_PAUSE_DAYS:-30}
      BILLING_TAX_PERCENT: ${BILLING_TAX_PERCENT:-16}
      ACCOUNT_RETENTION_DAYS: ${ACCOUNT_RETENTION_DAYS:-90}
      # Facturas (CFDI) con Facturapi
      FACTURAPI_API_KEY: ${FACTURAPI_API_KEY:-}
      CFDI_ISSUER_ZIP: ${CFDI_ISSUER_ZIP:-}
      # Registro, avisos al superadmin y aviso de privacidad
      TRIAL_MAX_SOCIAL_ACCOUNTS: ${TRIAL_MAX_SOCIAL_ACCOUNTS:-2}
      TRIAL_MAX_STORAGE_MB: ${TRIAL_MAX_STORAGE_MB:-200}
      TRIAL_AI_USD: ${TRIAL_AI_USD:-5}
      PLAN_DEFAULT_AI_USD: ${PLAN_DEFAULT_AI_USD:-20}
      PLAN_DEFAULT_STORAGE_MB: ${PLAN_DEFAULT_STORAGE_MB:-1024}
      SIGNUP_BLOCKED_DOMAINS: ${SIGNUP_BLOCKED_DOMAINS:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TERMS_VERSION: ${TERMS_VERSION:-}
      SUPERADMIN_DIGEST: ${SUPERADMIN_DIGEST:-true}
      SUPERADMIN_DIGEST_HOUR: ${SUPERADMIN_DIGEST_HOUR:-8}
      PRIVACY_COMPANY: ${PRIVACY_COMPANY:-}
      PRIVACY_ADDRESS: ${PRIVACY_ADDRESS:-}
      PRIVACY_CONTACT: ${PRIVACY_CONTACT:-}
      OPENROUTER_MEDIA_MODEL: ${OPENROUTER_MEDIA_MODEL:-}
      # Copiloto del panel (cada cuenta se enciende en Cuentas)
      COPILOT_ENABLED: ${COPILOT_ENABLED:-true}
      OPENROUTER_COPILOT_MODEL: ${OPENROUTER_COPILOT_MODEL:-}
      OPENROUTER_QUOTE_BUILDER_MODEL: ${OPENROUTER_QUOTE_BUILDER_MODEL:-}
      OPENROUTER_COPILOT_FALLBACK_MODELS: ${OPENROUTER_COPILOT_FALLBACK_MODELS:-}
      COPILOT_MAX_STEPS: ${COPILOT_MAX_STEPS:-}
      COPILOT_MAX_TOOL_CALLS: ${COPILOT_MAX_TOOL_CALLS:-}
      COPILOT_MAX_CHANGES: ${COPILOT_MAX_CHANGES:-}
      COPILOT_MAX_PROPOSALS: ${COPILOT_MAX_PROPOSALS:-}
      COPILOT_TURN_SECONDS: ${COPILOT_TURN_SECONDS:-}
      COPILOT_TURN_MAX_USD: ${COPILOT_TURN_MAX_USD:-}
      COPILOT_TURNS_PER_HOUR: ${COPILOT_TURNS_PER_HOUR:-}
      COPILOT_CONCURRENT_PER_ACCOUNT: ${COPILOT_CONCURRENT_PER_ACCOUNT:-}
      COPILOT_ACCOUNT_TURNS_PER_DAY: ${COPILOT_ACCOUNT_TURNS_PER_DAY:-}
      COPILOT_ACCOUNT_USD_PER_DAY: ${COPILOT_ACCOUNT_USD_PER_DAY:-}
      COPILOT_PROPOSAL_MINUTES: ${COPILOT_PROPOSAL_MINUTES:-}
      COPILOT_UNDO_DAYS: ${COPILOT_UNDO_DAYS:-}
      COPILOT_RETENTION_DAYS: ${COPILOT_RETENTION_DAYS:-}
      COPILOT_TOOL_PACKS: ${COPILOT_TOOL_PACKS:-}
      COPILOT_MAX_CONTINUATIONS: ${COPILOT_MAX_CONTINUATIONS:-}
      COPILOT_CODE_ACTIONS: ${COPILOT_CODE_ACTIONS:-}
      COPILOT_FILE_HOURS: ${COPILOT_FILE_HOURS:-}
      # Cobros de cada negocio a sus clientes (recordatorios de pago)
      RECEIVABLES_ENABLED: ${RECEIVABLES_ENABLED:-true}
      RECEIVABLE_DEFAULT_REMINDERS: ${RECEIVABLE_DEFAULT_REMINDERS:-}
      RECEIVABLE_DEFAULT_SEND_AT: ${RECEIVABLE_DEFAULT_SEND_AT:-10:00}
      RECEIVABLE_MAX_REMINDERS: ${RECEIVABLE_MAX_REMINDERS:-8}
      RECEIVABLE_MANUAL_REMIND_PER_DAY: ${RECEIVABLE_MANUAL_REMIND_PER_DAY:-3}
      RECEIVABLE_RECURRING_LEAD_DAYS: ${RECEIVABLE_RECURRING_LEAD_DAYS:-7}
      # Monitoreo
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # Token para /health/functional y /metrics (vacío = desactivados). ./riverrun install lo genera.
      HEALTH_TOKEN: ${HEALTH_TOKEN:-}
      ALERT_MUTE: ${ALERT_MUTE:-}
      ALERT_ESCALATE_MINUTES: ${ALERT_ESCALATE_MINUTES:-60}
      RESOURCE_WARN_RSS_MB: ${RESOURCE_WARN_RSS_MB:-1024}
      # live (producción) o sandbox (staging: bloquea envíos reales salvo OUTBOUND_SANDBOX_ALLOW).
      OUTBOUND_MODE: ${OUTBOUND_MODE:-live}
      OUTBOUND_SANDBOX_ALLOW: ${OUTBOUND_SANDBOX_ALLOW:-}
      BACKUP_DIR: /backups
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-36}
      # Vacío = el valor por defecto de la app (ver .env.example).
      # Conectar con Facebook (Messenger e Instagram)
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_CONFIG_ID: ${META_CONFIG_ID:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-}
      # Redes sociales (Zernio)
      ZERNIO_API_KEY: ${ZERNIO_API_KEY:-}
      ZERNIO_RATE_PER_MIN: ${ZERNIO_RATE_PER_MIN:-}
      # PDF de las cotizaciones
      # IN-6: los PDF de cotizaciones los hace el contenedor `pdf` (LibreOffice aparte, sin estos secretos ni internet).
      # QUOTE_PDF_BACKEND=soffice vuelve a LibreOffice dentro del backend.
      QUOTE_PDF_BACKEND: ${QUOTE_PDF_BACKEND:-gotenberg}
      QUOTE_PDF_URL: ${QUOTE_PDF_URL:-http://pdf:3000}
      QUOTE_PDF_TIMEOUT_MS: ${QUOTE_PDF_TIMEOUT_MS:-}
      SOFFICE_PATH: ${SOFFICE_PATH:-}
      CFDI_PRODUCT_KEY: ${CFDI_PRODUCT_KEY:-}
      CFDI_MAX_ATTEMPTS: ${CFDI_MAX_ATTEMPTS:-}
      # Trabajos, vigilante y apagado
      SCHEDULER_INTERVAL_MS: ${SCHEDULER_INTERVAL_MS:-}
      JOB_TIMEOUT_MS: ${JOB_TIMEOUT_MS:-}
      WATCHDOG: ${WATCHDOG:-}
      WATCHDOG_STALL_MS: ${WATCHDOG_STALL_MS:-}
      WATCHDOG_BLOCK_MS: ${WATCHDOG_BLOCK_MS:-}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-}
      # Base de datos: tiempos límite, tamaño del pool y espera de una migración por un candado
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-}
      DB_IDLE_TX_TIMEOUT_MS: ${DB_IDLE_TX_TIMEOUT_MS:-}
      DB_POOL_MAX: ${DB_POOL_MAX:-}
      MIGRATION_LOCK_TIMEOUT_MS: ${MIGRATION_LOCK_TIMEOUT_MS:-}
      # Avisos de WhatsApp caído
      WHATSAPP_ALERT_DOWN_RATIO: ${WHATSAPP_ALERT_DOWN_RATIO:-}
      WHATSAPP_ALERT_SEND_FAILURES: ${WHATSAPP_ALERT_SEND_FAILURES:-}
      WHATSAPP_POST_UPDATE_HOURS: ${WHATSAPP_POST_UPDATE_HOURS:-}
      # Retención y diagnóstico
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-}
      AI_RUN_DETAIL_DAYS: ${AI_RUN_DETAIL_DAYS:-}
      ALLOW_PRIVATE_WEBHOOKS: ${ALLOW_PRIVATE_WEBHOOKS:-}
      RIVERRUN_ENV: ${RIVERRUN_ENV:-}
      HTTP_LOG: ${HTTP_LOG:-}
      LOG_DEBUG: ${LOG_DEBUG:-}
    volumes:
      - uploads:/data/uploads
      - backups:/backups:ro
    ports:
      - "${PANEL_BIND:-127.0.0.1}:3000:3000"
    networks: [default, data, pdf]

  # IN-6: Word → PDF de las cotizaciones (Gotenberg con LibreOffice). Sin secretos en su entorno, en una red interna sin
  # salida a internet (solo el backend la alcanza): una plantilla maliciosa no lee llaves ni llega a ningún lado.
  pdf:
    image: ${PDF_IMAGE:-gotenberg/gotenberg:9.2.0-libreoffice@sha256:222703e41a67ecf5b1760d4c438a8c55de2afc6dd10406e39de114c2e53a9886}
    restart: unless-stopped
    mem_limit: ${PDF_MEM_LIMIT:-1g}
    pids_limit: 300
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    command: ["gotenberg", "--api-timeout=90s", "--libreoffice-restart-after=10", "--log-level=warn"]
    networks: [pdf]

  # Respaldo diario cifrado de las dos bases de datos, las fotos y las sesiones de WhatsApp (ver README → Respaldos).
  backup:
    mem_limit: ${BACKUP_MEM_LIMIT:-512m}
    pids_limit: 200
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # Corre como root: cifra con gpg y lee los volúmenes de otros dueños (DAC_OVERRIDE); pg_dump se conecta por TCP.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    build: ./docker/backup
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      PGHOST: postgres
      PGUSER: chatbot
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?Define BACKUP_PASSPHRASE en .env (ejecuta ./riverrun install)}
      # Evolution guarda en Redis las claves de cifrado de cada sesión de WhatsApp: se respaldan con todo lo demás.
      BACKUP_REDIS_URI: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
      BACKUP_HOUR: ${BACKUP_HOUR:-03:30}
      # INF-8: días que Evolution conserva cada mensaje de WhatsApp (0 = sin límite); los borrados del panel llegan ahí cada hora.
      EVOLUTION_MESSAGE_DAYS: ${EVOLUTION_MESSAGE_DAYS:-7}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      APP_VERSION: ${APP_VERSION:-dev}
      EVOLUTION_IMAGE: *evolution-image
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_KEY: ${BACKUP_S3_KEY:-}
      BACKUP_S3_SECRET: ${BACKUP_S3_SECRET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      BACKUP_REMOTE_KEEP_DAYS: ${BACKUP_REMOTE_KEEP_DAYS:-45}
    volumes:
      - backups:/backups
      - uploads:/data/uploads:ro
      - evolution_instances:/evolution/instances:ro
    networks: [default, data]

  # Solo para restaurar: ./riverrun restore  (no arranca con el resto).
  restore:
    mem_limit: ${BACKUP_MEM_LIMIT:-512m}
    pids_limit: 200
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # Igual que backup: restaura archivos y bases con distintos dueños.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    build: ./docker/backup
    profiles: ["tools"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: chatbot
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      EVOLUTION_IMAGE: *evolution-image
    volumes:
      - backups:/backups
      - uploads:/data/uploads
      - evolution_instances:/evolution/instances
      # Deja ahí la copia de Redis; ./riverrun restore la carga con el propio Redis (docker/backup/redis-load.sh).
      - redisdata:/redis
    networks: [default, data]

  caddy:
    mem_limit: ${CADDY_MEM_LIMIT:-256m}
    pids_limit: 200
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # Solo abre los puertos 80 y 443. Certificados en /data y configuración en /config (volúmenes); /tmp en memoria.
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: [/tmp]
    image: caddy:2-alpine@sha256:70b3180738b46cd88e49b300d790ae448a0aca3f58edef0f000bb57d619a9ab3
    profiles: ["https"]
    restart: unless-stopped
    # Caddy entra hasta que el backend responde sano (base de datos lista): sin errores 502 al arrancar.
    depends_on:
      backend: { condition: service_healthy }
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

# La base y Redis viven en una red interna sin salida a internet; Caddy (lo único expuesto) no la alcanza.
networks:
  default: {}
  data:
    internal: true
  pdf:
    internal: true

volumes:
  pgdata:
  redisdata:
  evolution_instances:
  uploads:
  backups:
  caddy_data:
  caddy_config:
