# Todo en un solo VPS: PostgreSQL + Redis + Evolution API + backend del chatbot (+ Caddy opcional para HTTPS).
# Uso:  cp .env.example .env  (edita los valores)  &&  docker compose up -d
# Con HTTPS:  docker compose --profile https up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chatbot
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-evolution.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  evolution:
    # Recomendado: fija una versión probada, p.ej. evoapicloud/evolution-api:v2.3.x
    image: ${EVOLUTION_IMAGE:-evoapicloud/evolution-api:latest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://chatbot:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"   # necesario para descargar notas de voz
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: ${EVOLUTION_CLIENT_NAME:-Chatbot}
      QRCODE_LIMIT: "30"
      DEL_INSTANCE: "false"
    volumes:
      - evolution_instances:/evolution/instances
    # Solo accesible desde el propio VPS (usa un túnel SSH para abrir el manager).
    ports:
      - "127.0.0.1:8080:8080"

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      evolution: { condition: service_started }
    environment:
      PORT: 3000
      DATABASE_URL: postgres://chatbot:${POSTGRES_PASSWORD}@postgres:5432/chatbot
      WEBHOOK_BASE_URL: http://backend:3000
      EVOLUTION_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_SUMMARY_MODEL: ${OPENAI_SUMMARY_MODEL:-gpt-4.1-mini}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "${PANEL_BIND:-127.0.0.1}:3000:3000"

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [backend]
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  pgdata:
  redisdata:
  evolution_instances:
  uploads:
  caddy_data:
