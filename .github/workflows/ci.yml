name: CI

on:
  pull_request:
    paths: ['chatbot-platform/**', '.github/workflows/ci.yml']
  push:
    branches: [main]
    paths: ['chatbot-platform/**', '.github/workflows/ci.yml']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: chatbot-platform

jobs:
  test:
    name: Tipos y pruebas
    runs-on: ubuntu-latest
    # Una corrida sana tarda ~18 min (14 de pruebas y el resto en el navegador); el margen deja lugar a los reintentos
    # de los paquetes del sistema y del navegador sin cancelar una corrida sana.
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: chatbot
          POSTGRES_PASSWORD: chatbot
          POSTGRES_DB: chatbot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chatbot" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://chatbot:chatbot@localhost:5432/chatbot_test
      REQUIRE_PGVECTOR: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chatbot-platform/package-lock.json
      - run: npm ci
      - name: Revisión de tipos
        run: npm run typecheck
      - name: Panel (módulos, imports y sintaxis)
        run: npm run check:frontend && node --check public/app.js
      - name: Pruebas
        run: npm test
      # Lo que se colgaba era apt: una descarga del espejo de Ubuntu que deja de mandar datos y espera para siempre.
      # apt lleva sus propios tiempos (reintenta una descarga atascada); si aun así hay que cortar, se mata lo que quedó
      # (el apt-get que lanza sudo sobrevive al timeout y deja el candado de dpkg) y el siguiente intento arranca limpio.
      - name: Paquetes del sistema para el navegador
        timeout-minutes: 14
        run: |
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null
          for i in 1 2 3; do
            timeout -k 15 240 npx playwright install-deps chromium && exit 0
            echo "::warning::Paquetes del sistema: el intento $i falló o se agotó; se limpia apt y se reintenta"
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock /var/lib/apt/lists/lock
            sudo dpkg --configure -a || true
          done
          exit 1
      # El navegador se guarda en caché por versión de Playwright; sin caché se descarga (solo HTTP, seguro de cortar).
      - name: Versión de Playwright
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Caché del navegador de pruebas
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Navegador de pruebas
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            timeout -k 10 180 npx playwright install chromium && exit 0
            echo "::warning::Navegador: el intento $i falló o se agotó; se reintenta"
          done
          exit 1
      - name: Regresión UX y accesibilidad
        run: npm run test:ux
      - name: Activación semántica en navegador y aislamiento de base
        run: npm run test:semantic:ux
      - name: Agent drafts, publication and Promptfoo UX
        run: npm run test:agent:ux
      - name: Contact workspace and account AI budget UX
        run: npm run test:contact:ux
      - name: Cotizaciones en navegador
        run: npm run test:quotes:ux
      - name: Cobro en navegador
        run: npm run test:billing:ux
      - name: Páginas públicas, reservar y widget en navegador
        run: npm run test:public:ux
      - name: Verificación en dos pasos en navegador
        run: npm run test:identity:ux
      - name: Cuenta en navegador (dueño, invitar, transferir, cambiar el correo, bajas)
        run: npm run test:account:ux
      - name: Guardar evidencia UX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-test-results
          path: chatbot-platform/data/ux-test-results
      - name: Guardar evidencia de activación semántica
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-ux-results
          path: chatbot-platform/data/semantic-ux-results
      - name: Dependencias vulnerables (solo las de producción)
        run: npm audit --omit=dev --audit-level=high

  # Auditoría de botones (docs/auditoria-botones.md): presiona cada control del panel con cada rol, en paralelo con
  # «Tipos y pruebas» para no alargarlo. Si un botón deja de hacer lo que dice, el PR falla.
  buttons:
    name: Botones del panel
    runs-on: ubuntu-latest
    # Una corrida sana tarda ~20 min en una máquina de 4 núcleos (más la instalación); el margen es para un runner más lento.
    timeout-minutes: 50
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: chatbot
          POSTGRES_PASSWORD: chatbot
          POSTGRES_DB: chatbot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chatbot" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://chatbot:chatbot@localhost:5432/chatbot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chatbot-platform/package-lock.json
      - run: npm ci
      # Los mismos pasos (y reintentos) del navegador que «Tipos y pruebas».
      - name: Paquetes del sistema para el navegador
        timeout-minutes: 14
        run: |
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null
          for i in 1 2 3; do
            timeout -k 15 240 npx playwright install-deps chromium && exit 0
            echo "::warning::Paquetes del sistema: el intento $i falló o se agotó; se limpia apt y se reintenta"
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock /var/lib/apt/lists/lock
            sudo dpkg --configure -a || true
          done
          exit 1
      - name: Versión de Playwright
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Caché del navegador de pruebas
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Navegador de pruebas
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            timeout -k 10 180 npx playwright install chromium && exit 0
            echo "::warning::Navegador: el intento $i falló o se agotó; se reintenta"
          done
          exit 1
      - name: Presionar cada botón del panel
        run: npm run test:buttons
      - name: Guardar evidencia de la auditoría de botones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: button-audit
          path: chatbot-platform/data/button-audit

  scripts:
    name: Scripts y respaldos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chatbot
          POSTGRES_PASSWORD: chatbot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chatbot" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar cliente de PostgreSQL 16
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16 shellcheck redis-server || sudo apt-get install -y -qq postgresql-client shellcheck redis-server
      - name: shellcheck
        run: shellcheck -S warning riverrun docker/backup/backup.sh docker/backup/redis-load.sh scripts/*.sh ops/*.sh
      - name: Respaldo → destruir → restaurar (de punta a punta)
        env:
          PGHOST: localhost
          PGUSER: chatbot
          PGPASSWORD: chatbot
        run: |
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          bash scripts/test-backup.sh
      - name: Flujo de actualización con vuelta atrás (docker simulado)
        run: bash scripts/test-cli.sh
      - name: El instalador genera una configuración válida
        run: |
          d="$(mktemp -d)"; cp riverrun .env.example "$d/"; cp docker-compose.yml "$d/"; cp -r docker "$d/"
          (cd "$d" && RIVERRUN_DOMAIN=bot.ejemplo.com RIVERRUN_ADMIN_EMAIL=yo@ejemplo.com ./riverrun install --non-interactive --no-start \
            && grep -q '^BACKUP_PASSPHRASE=.\{20,\}' .env && grep -q '^COMPOSE_PROFILES=https' .env \
            && docker compose --profile https --profile tools config -q)

  docker:
    name: Imágenes de Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: x
      EVOLUTION_API_KEY: x
      BACKUP_PASSPHRASE: x
      ADMIN_PASSWORD: x
      SESSION_SECRET: 0123456789abcdef
      DOMAIN: ejemplo.com
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose
        run: docker compose --profile https --profile tools config -q
      - name: Validar el overlay de staging (garantías de la configuración renderizada)
        run: bash scripts/test-staging-overlay.sh
      - name: Construir backend y respaldos
        run: docker compose build backend backup
      - name: Prueba de humo de la imagen del backend (sana, encabezados de seguridad, apagado en orden) y Caddyfile
        run: bash scripts/test-image-smoke.sh
      # Las dependencias de la app bloquean (como npm audit; sin el npm que trae la imagen de Node, que la app no usa);
      # los paquetes del sistema de la imagen base se reportan.
      - name: Escaneo de la imagen (dependencias de la app)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --quiet
          --pkg-types library --skip-dirs /usr/local/lib/node_modules --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1
          chatbot-platform-backend
      - name: Escaneo de la imagen (paquetes del sistema, informativo)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --quiet
          --pkg-types os --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 chatbot-platform-backend
      - name: Simulacro de restauración sin S3 (respaldo, clave correcta y equivocada, restauración)
        run: bash scripts/test-restore-drill.sh
      - name: Preflight sin red con la configuración que genera el instalador
        run: |
          # Se limpian las variables del job: Compose las usaría en lugar del .env generado y la prueba no revisaría lo que dice.
          d="$(mktemp -d)"; cp riverrun .env.example docker-compose.yml "$d/"; cp -r docker "$d/"
          (cd "$d" && env -u POSTGRES_PASSWORD -u EVOLUTION_API_KEY -u BACKUP_PASSPHRASE -u ADMIN_PASSWORD -u SESSION_SECRET -u DOMAIN \
            RIVERRUN_DOMAIN=bot.ejemplo.com RIVERRUN_ADMIN_EMAIL=yo@ejemplo.com ./riverrun install --non-interactive --no-start >/dev/null)
          cp "$d/.env" .env
          out="$RUNNER_TEMP/preflight.txt"
          env -u POSTGRES_PASSWORD -u EVOLUTION_API_KEY -u BACKUP_PASSPHRASE -u ADMIN_PASSWORD -u SESSION_SECRET -u DOMAIN \
            ./riverrun preflight --offline > "$out" 2>&1 || { cat "$out"; echo "::error::El preflight bloqueó una configuración válida del instalador"; exit 1; }
          cat "$out"
          grep -q "Configuración: sin problemas críticos" "$out" || { echo "::error::El preflight no revisó la configuración"; exit 1; }
          grep -q "No verificado: último respaldo" "$out" || { echo "::error::El preflight afirmó respaldos que no revisó"; exit 1; }
